name: Windows production checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- docs/workflow.html
      - name: Explicitly install checksum-verified test tools
        run: npm run tools:install
      - name: Real media, process cancellation and forced-crash integration
        env:
          SOURCESPOOL_YTDLP: ${{ github.workspace }}\.tools\yt-dlp.exe
          SOURCESPOOL_FFMPEG: ${{ github.workspace }}\.tools\ffmpeg-9.0.2-essentials_build\bin\ffmpeg.exe
        run: npm run test:integration
